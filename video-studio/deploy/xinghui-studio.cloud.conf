# Kunpeng studio cloud entry. Basic auth stays as fallback; a signed cookie
# from /api/auth/login satisfies auth_request for 30 days without prompts.
server {
    listen 8110;
    listen [::]:8110;
    server_name 47.108.114.17 _;

    location = /api/auth/login {
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    location / {
        satisfy any;
        auth_basic "kunpeng";
        auth_basic_user_file /etc/nginx/auth/xinghui.htpasswd;
        auth_request /_kunpeng_token;
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 28m;
    }

    location = /_kunpeng_token {
        internal;
        proxy_pass http://127.0.0.1:4175/api/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
}
