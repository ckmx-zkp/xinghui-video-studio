# Forward-only. Director stays on the home PC tunnel.
# Do not use :80/:443 or custom domains: Aliyun ICP page will intercept.
server {
    listen 8110;
    listen [::]:8110;
    server_name 47.108.114.17 _;

    location / {
        auth_basic "xinghui";
        auth_basic_user_file /etc/nginx/auth/xinghui.htpasswd;
        proxy_pass http://127.0.0.1:17415;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 28m;
    }
}
